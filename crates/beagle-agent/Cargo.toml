[package]
name = "beagle-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
description = "Engine for beagle's native agent runtime: config, state, poller, worktree, runner, and IPC."
license = "MIT"
repository = "https://github.com/matthewmyrick/beagle"

[dependencies]
beagle = { path = "../../cli" }
nix = { version = "0.29", features = ["signal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
