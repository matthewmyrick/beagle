name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# The Rust crates live in a Cargo workspace at the repo root: `cli` (the
# `beagle` domain layer + TUI) plus the native agent runtime `beagle-agent`
# and `beagle-agentd` (epic #137). Every cargo invocation runs at the root
# and covers the whole workspace. (`desktop/src-tauri` is excluded from the
# workspace and checked separately in desktop.yml.)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint (pedantic, zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Docs build cleanly
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
