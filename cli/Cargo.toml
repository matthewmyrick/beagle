[package]
name = "beagle"
version = "0.27.0"
edition = "2021"
rust-version = "1.79"
description = "A TUI for root-cause analysis workspaces: notes, timelines, and diagrams that explain what broke, why, and how to fix it."
license = "MIT"
repository = "https://github.com/matthewmyrick/beagle"

[dependencies]
crossterm = "0.28"
notify = "7"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde-well-known"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"

# Lints and the release profile are defined once at the workspace root
# (../Cargo.toml) and inherited here.
[lints]
workspace = true
