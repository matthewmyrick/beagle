# Root Cargo workspace for the beagle monorepo's Rust crates.
#
# Members: the existing `cli` crate (the `beagle` domain layer + TUI) and the
# native agent runtime introduced by epic #137 — `beagle-agent` (the engine
# library) and `beagle-agentd` (the always-on daemon binary).
#
# `desktop/src-tauri` is deliberately EXCLUDED: it path-depends on `cli` but is
# built by the Tauri/Vite toolchain with its own lockfile, and CI builds it in
# its own workflow (desktop.yml). Excluding the whole `desktop/` subtree keeps
# it a standalone workspace root so `tauri build` is unaffected.
[workspace]
resolver = "2"
members = ["cli", "crates/beagle-agent", "crates/beagle-agentd"]
exclude = ["desktop"]

# Shared, pedantic lint profile for every workspace member. Members opt in with
# `[lints] workspace = true`, so the rules live in exactly one place.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

# Release profile for the whole workspace (must live at the root — Cargo ignores
# `[profile.*]` in non-root members).
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
